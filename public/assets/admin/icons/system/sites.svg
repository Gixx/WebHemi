<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Pastel blue disc -->
  <circle cx="32" cy="32" r="28" fill="#A8D8EA"/>
  <!-- Globe outer circle -->
  <circle cx="32" cy="32" r="13" fill="none" stroke="#2878A0" stroke-width="2" stroke-linecap="round"/>
  <!-- Equator line -->
  <line x1="19" y1="32" x2="45" y2="32" stroke="#2878A0" stroke-width="1.5"/>
  <!-- Meridian line -->
  <line x1="32" y1="19" x2="32" y2="45" stroke="#2878A0" stroke-width="1.5"/>
  <!-- Elliptic vertical band -->
  <ellipse cx="32" cy="32" rx="7" ry="13" fill="none" stroke="#2878A0" stroke-width="1.5"/>
  <!-- Top/bottom latitude curves -->
  <path d="M22 26 Q32 23 42 26" fill="none" stroke="#2878A0" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M22 38 Q32 41 42 38" fill="none" stroke="#2878A0" stroke-width="1.2" stroke-linecap="round"/>
</svg>
